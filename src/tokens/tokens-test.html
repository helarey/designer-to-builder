<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design token test page</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* ============================================================
     Token test page — visual chrome.

     Aesthetic: a precision instrument. Editorial serif display type
     against a monospace data voice, generous rules, restrained colour.
     The page is a measuring device, so nothing decorative competes
     with the specimens being measured.

     Every token reference below carries a literal fallback, so a
     broken token set still renders a page that explains the breakage.
     No webfonts: AGENTS.md forbids third-party dependencies, so the
     personality comes from carefully built local stacks.
     ============================================================ */

  /* Page-chrome typography, deliberately independent of the tokens
     under test. Suffixed --pg- so it can never collide with a
     discovered token name in any project this page is dropped into. */
  :root {
    --pg-display: "Iowan Old Style", "Palatino Linotype", Palatino,
                  "Hoefler Text", Charter, Georgia, serif;
    --pg-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo,
               "Roboto Mono", monospace;

    /* Type scale, 1.25 ratio, rem-based so browser zoom is respected. */
    --pg-xs: 0.6875rem;   /* 11px  micro labels          */
    --pg-sm: 0.8125rem;   /* 13px  captions, values      */
    --pg-md: 0.9375rem;   /* 15px  body                  */
    --pg-lg: 1.375rem;    /* 22px  section headings      */
    --pg-xl: 2.5rem;      /* 40px  page title            */

    --pg-rule: color-mix(in srgb, currentColor 14%, transparent);
    --pg-rule-strong: color-mix(in srgb, currentColor 32%, transparent);
    --pg-dim: color-mix(in srgb, currentColor 62%, transparent);
    --pg-faint: color-mix(in srgb, currentColor 6%, transparent);

    --pg-gutter: clamp(1.25rem, 4vw, 3rem);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 0 var(--pg-gutter) 8rem;
    background: var(--background-page, #fdfdfc);
    color: var(--foreground-default-primary, #16151a);
    font-family: var(--pg-mono);
    font-size: var(--pg-md);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-kerning: normal;
  }

  .wrap { max-width: 74rem; margin: 0 auto; }

  /* ---------- masthead ---------- */
  header.page-head {
    padding: clamp(3rem, 9vw, 6rem) 0 1.75rem;
    margin-bottom: 3.5rem;
    border-bottom: 2px solid var(--pg-rule-strong);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 1.5rem 2rem;
    align-items: end;
  }

  h1 {
    font-family: var(--pg-display);
    font-size: var(--pg-xl);
    font-weight: 400;
    line-height: 1.02;
    letter-spacing: -0.022em;
    margin: 0 0 0.75rem;
    text-wrap: balance;
  }
  /* Hanging index number, the instrument-panel cue. */
  h1::before {
    content: "01";
    display: block;
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    letter-spacing: 0.28em;
    color: var(--pg-dim);
    margin-bottom: 1rem;
    font-variant-numeric: tabular-nums;
  }

  .sub {
    font-size: var(--pg-sm);
    line-height: 1.55;
    color: var(--pg-dim);
    margin: 0;
    max-width: 58ch;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- sections ---------- */
  section { margin-bottom: 5rem; scroll-margin-top: 2rem; }

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.75rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--pg-rule);
  }

  h2 {
    font-family: var(--pg-display);
    font-size: var(--pg-lg);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.014em;
    margin: 0;
    flex: 1 1 auto;
  }
  /* Section numerals, assigned in document order. */
  .sec-head::before {
    counter-increment: sec;
    content: counter(sec, decimal-leading-zero);
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    letter-spacing: 0.2em;
    color: var(--pg-dim);
    font-variant-numeric: tabular-nums;
    padding-top: 0.25rem;
  }
  main { counter-reset: sec; }

  .count {
    font-size: var(--pg-xs);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--pg-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .group-label {
    font-size: var(--pg-xs);
    font-weight: 500;
    letter-spacing: 0.19em;
    text-transform: uppercase;
    color: var(--pg-dim);
    margin: 2.25rem 0 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .group-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--pg-rule);
  }
  .group-label:first-of-type { margin-top: 0; }

  /* ---------- swatches ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
    gap: 1px;
    background: var(--pg-rule);
    border: 1px solid var(--pg-rule);
  }

  /* Contiguous hairline grid: cells share rules instead of floating apart. */
  .swatch {
    background: var(--background-page, #fff);
    display: flex;
    flex-direction: column;
    transition: transform .18s cubic-bezier(.2,.7,.3,1);
  }
  .swatch:hover { transform: translateY(-2px); position: relative; z-index: 2; }

  .swatch .chip {
    height: 4.5rem;
    background-color: #fff;
    background-image:
      linear-gradient(45deg, rgba(0,0,0,.11) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.11) 75%),
      linear-gradient(45deg, rgba(0,0,0,.11) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.11) 75%);
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
    position: relative;
  }
  .swatch .chip::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--chip);
  }

  .swatch .meta {
    padding: 0.6rem 0.7rem 0.65rem;
    border-top: 1px solid var(--pg-rule);
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 0;
  }
  .name {
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    line-height: 1.4;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .val {
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    color: var(--pg-dim);
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  /* ---------- semantic pairs ---------- */
  .pairs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: 1px;
    background: var(--pg-rule);
    border: 1px solid var(--pg-rule);
  }
  .pair {
    padding: 1.1rem 1.15rem 0.95rem;
    min-height: 8.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .pair .demo {
    font-family: var(--pg-display);
    font-size: 1.5rem;
    line-height: 1.15;
    letter-spacing: -0.015em;
    flex: 1 1 auto;
  }
  .pair .tokens {
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    line-height: 1.5;
    opacity: .74;
    overflow-wrap: anywhere;
  }
  .pair .flags {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
  }
  .pair .flag {
    border: 1px solid currentColor;
    border-radius: 2px;
    padding: 0.1rem 0.4rem;
    opacity: .68;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pair .flag[data-warn="1"] {
    opacity: 1;
    font-weight: 700;
    border-width: 1.5px;
  }

  /* ---------- typography specimens ---------- */
  .type-row {
    display: grid;
    grid-template-columns: minmax(11rem, 15rem) minmax(0, 1fr);
    gap: 1.5rem 2rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--pg-rule);
    align-items: baseline;
  }
  .type-row:last-child { border-bottom: 0; }
  .type-specs {
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    line-height: 1.65;
    color: var(--pg-dim);
    font-variant-numeric: tabular-nums;
  }
  .type-specs .tname {
    display: block;
    color: var(--foreground-default-primary, #111);
    letter-spacing: 0.11em;
    text-transform: uppercase;
    margin-bottom: 0.45rem;
    overflow-wrap: anywhere;
  }
  .type-specimen { min-width: 0; overflow-wrap: anywhere; }

  /* ---------- dimensions ---------- */
  .dim-row { display: flex; flex-wrap: wrap; gap: 1.75rem; align-items: flex-start; }
  .dim-demo {
    background: var(--pg-faint);
    border: 1px dashed var(--pg-rule-strong);
    min-width: 8.5rem;
  }
  .dim-inner {
    background: var(--background-brand-subtle, rgba(0,0,0,.06));
    color: var(--foreground-brand-primary, inherit);
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    text-align: center;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .dim-cap {
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    line-height: 1.6;
    color: var(--pg-dim);
    margin-top: 0.6rem;
    white-space: pre-line;
  }

  /* ---------- shadow ---------- */
  .shadow-card {
    background: var(--background-base, #fff);
    border-radius: var(--radius-base, 4px);
    padding: 1.5rem 1.6rem;
    max-width: 22rem;
    font-family: var(--pg-mono);
    font-size: var(--pg-sm);
    border: 1px solid var(--pg-rule);
  }

  /* ---------- component demos ---------- */
  .cmp { max-width: 38rem; }
  .cmp details {
    border: var(--border-width, 1px) solid;
    border-radius: var(--radius-base, 4px);
    margin-bottom: 0.6rem;
    overflow: hidden;
  }
  .cmp summary {
    list-style: none;
    cursor: pointer;
    padding: var(--padding-loose, 12px);
    font-family: var(--typography-body-strong-font-family, var(--pg-mono));
    font-size: var(--typography-body-strong-font-size, var(--pg-md));
    font-weight: var(--typography-body-strong-font-weight, 600);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: center;
  }
  .cmp summary::-webkit-details-marker { display: none; }
  .cmp summary::after {
    content: "";
    width: 0.5rem; height: 0.5rem;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px);
    transition: transform .2s ease;
    opacity: .65;
    flex: none;
  }
  .cmp details[open] summary::after {
    transform: rotate(225deg) translate(-2px, -2px);
  }
  .cmp .body {
    padding: var(--padding-loose, 12px);
    font-size: var(--typography-body-font-size, var(--pg-md));
    line-height: var(--typography-body-line-height, 1.55);
    border-top: var(--border-width, 1px) solid;
  }
  .cmp .hint {
    font-size: var(--pg-xs);
    letter-spacing: 0.04em;
    color: var(--pg-dim);
    margin: 0 0 0.85rem;
  }

  /* ---------- theme switcher ---------- */
  .switcher {
    display: flex;
    gap: 0;
    align-items: stretch;
    border: 1px solid var(--pg-rule-strong);
    border-radius: 2px;
    overflow: hidden;
  }
  .switcher button {
    font-family: var(--pg-mono);
    font-size: var(--pg-xs);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    padding: 0.55rem 1rem;
    cursor: pointer;
    border: 0;
    border-right: 1px solid var(--pg-rule-strong);
    background: transparent;
    color: var(--pg-dim);
    transition: background .15s ease, color .15s ease;
  }
  .switcher button:last-child { border-right: 0; }
  .switcher button:hover { background: var(--pg-faint); color: inherit; }
  .switcher button[aria-pressed="true"] {
    background: var(--foreground-default-primary, #111);
    color: var(--background-page, #fff);
  }
  .switcher button:focus-visible {
    outline: 2px solid var(--background-brand-pop, #2e7bbe);
    outline-offset: -2px;
  }

  /* ---------- notes ---------- */
  .note {
    border: 1px solid var(--pg-rule);
    border-left: 2px solid currentColor;
    padding: 1rem 1.15rem;
    font-family: var(--pg-mono);
    font-size: var(--pg-sm);
    line-height: 1.6;
    margin-bottom: 2.5rem;
    max-width: 62ch;
  }
  .note strong { font-weight: 700; }
  .note code {
    font-family: var(--pg-mono);
    background: var(--pg-faint);
    padding: 0.05em 0.35em;
    border-radius: 2px;
  }
  .note[hidden] { display: none; }

  /* Staggered reveal: one orchestrated load, no per-element fidgeting. */
  @media (prefers-reduced-motion: no-preference) {
    section, header.page-head {
      animation: rise .5s cubic-bezier(.2,.7,.3,1) backwards;
    }
    header.page-head { animation-delay: .02s; }
    section:nth-of-type(1) { animation-delay: .06s; }
    section:nth-of-type(2) { animation-delay: .10s; }
    section:nth-of-type(3) { animation-delay: .14s; }
    section:nth-of-type(4) { animation-delay: .18s; }
    section:nth-of-type(5) { animation-delay: .22s; }
    section:nth-of-type(6) { animation-delay: .26s; }
    section:nth-of-type(n+7) { animation-delay: .30s; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  @media (max-width: 40rem) {
    header.page-head { grid-template-columns: 1fr; }
    .type-row { grid-template-columns: 1fr; gap: 0.75rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <div>
      <h1>Design token test page</h1>
      <p class="sub" id="summary">Reading tokens…</p>
    </div>
    <div class="switcher" id="switcher" hidden></div>
  </header>

  <div class="note err" id="load-error" hidden></div>

  <main id="out"></main>

</div>

     Chrome blocks BOTH ways of reading a stylesheet's source under file://:
     fetch() is refused by CORS, and sheet.cssRules throws once the sheet was
     loaded from a file:// URL. Selector text — which is where the theme names
     live — is therefore unreadable at runtime in the common case of opening
     this page straight off disk.

     So the two halves of the problem are separated:

       structure  (which properties, which blocks, which themes exist)
                  -> settled below, read from tokens.css when this page was
                     generated. Regenerate the page if the token file gains
                     or loses properties.

                     getComputedStyle on the <link rel="stylesheet"> in <head>.

      { name: "--component-accordion-foreground", value: "var(--grey-100)" },

     { selector, decls: [{ name, value }] } — so build(), the classification

     value wherever one exists, falling back to the authored string for a
     property the browser does not expose (an unsupported value, or one the
     cascade has dropped). */

      return {
        selector: b.selector,
        decls: b.decls.map(function (d) {
          var has = Object.prototype.hasOwnProperty.call(live, d.name);
          /* Two fields, deliberately:

               value    — the authored text. An alias keeps its `var(...)`
                          form, because that is how downstream code tells a
                          semantic token from a primitive.
               computed — what the property resolves to right now, in the
                          theme that is currently applied.

             always reproduce the first block's values, so a themed token
             would print its light value while its swatch painted the dark
             one. resolve() prefers `computed` and never walks the chain. */
          return {
            name: d.name,

  /* ---------- contrast ----------

      typeStyles.forEach(function (t) { typoCount += Object.keys(t.parts).length; });

      var missing = {}, missingList = [];
      typeStyles.forEach(function (t) {

          missing[first] = 1;
          missingList.push(first);
        }
      });
      if (missingList.length) {
        var warn = el("div", "note");
        warn.innerHTML = "<strong>Not rendering in the intended face.</strong><br>" +
          missingList.map(function (f) { return "<code>" + f + "</code>"; }).join(", ") +
          (missingList.length === 1 ? " is" : " are") +
          " not installed locally and no webfont is loaded, so the specimens below " +
          "fall back to another family. The token itself is wired correctly — this is " +
          "a font availability issue, not a token issue.";
        s3.appendChild(warn);
      }

      typeStyles.forEach(function (t) {
        var row = el("div", "type-row");

        var specs = el("div", "type-specs");
        specs.appendChild(el("span", "tname", t.prefix.replace(/^--/, "")));
        Object.keys(t.parts).forEach(function (k) {
          var line = el("div", null, k.replace("font-", "") + " " +
                        resolve(valueMap[t.parts[k]], valueMap));
          specs.appendChild(line);
        });
        row.appendChild(specs);

        var line = el("div", "type-specimen",
          "The quick brown fox jumps over the lazy dog 0123456789");
        if (t.parts["font-family"])    line.style.fontFamily    = "var(" + t.parts["font-family"] + ")";
        if (t.parts["font-size"])      line.style.fontSize      = "var(" + t.parts["font-size"] + ")";
        if (t.parts["font-weight"])    line.style.fontWeight    = "var(" + t.parts["font-weight"] + ")";
        if (t.parts["line-height"])    line.style.lineHeight    = "var(" + t.parts["line-height"] + ")";
        if (t.parts["letter-spacing"]) line.style.letterSpacing = "var(" + t.parts["letter-spacing"] + ")";
        row.appendChild(line);
        s3.appendChild(row);
      });
      out.appendChild(s3);
    }

    /* --- dimensions: one combined demo box --- */
    if (dimens.length) {
      var s4 = section("Spacing, radius & border", dimens.length);
      var pad = dimens.filter(function (d) { return /padding|space|gap/i.test(d.name); });
      var rad = dimens.filter(function (d) { return /radius/i.test(d.name); });
      var bor = dimens.filter(function (d) { return /border|width|stroke/i.test(d.name); });
      var used = {};
      [pad, rad, bor].forEach(function (a) { a.forEach(function (d) { used[d.name] = 1; }); });

      var row = el("div", "dim-row");
      /* Combine each padding with each radius/border so every token is exercised. */
      var padList = pad.length ? pad : [null];
      padList.forEach(function (p) {
        var box = el("div");
        var demo = el("div", "dim-demo");
        if (p) demo.style.padding = "var(" + p.name + ")";
        if (rad.length) demo.style.borderRadius = "var(" + rad[0].name + ")";
        if (bor.length) {
          demo.style.borderWidth = "var(" + bor[0].name + ")";
          demo.style.borderStyle = "solid";
          demo.style.borderColor = "var(--border-base, #999)";
        }
        var inner = el("div", "dim-inner", "content");
        inner.style.padding = "10px 6px";
        if (rad.length) inner.style.borderRadius = "calc(var(" + rad[0].name + ") / 2)";
        demo.appendChild(inner);
        box.appendChild(demo);
        var caps = [];
        if (p) caps.push("padding: " + p.name);
        if (rad.length) caps.push("radius: " + rad[0].name);
        if (bor.length) caps.push("border: " + bor[0].name);
        box.appendChild(el("div", "dim-cap", caps.join("\n")));
        box.querySelector(".dim-cap").style.whiteSpace = "pre-line";
        row.appendChild(box);
      });
      s4.appendChild(row);

      /* Any dimension token not covered by the demos above. */
      var leftovers = dimens.filter(function (d) { return !used[d.name]; });
      if (leftovers.length) {
        s4.appendChild(el("div", "group-label", "other dimension tokens"));
        var lg = el("div", "grid");
        leftovers.forEach(function (d) {
          var c = el("div", "swatch");
          var meta = el("div", "meta");
          meta.appendChild(el("code", "name", d.name));
          meta.appendChild(el("code", "val", resolve(d.value, valueMap)));
          c.appendChild(meta);
          lg.appendChild(c);
        });
        s4.appendChild(lg);
      }
      out.appendChild(s4);
    }

    /* --- shadow --- */
    if (shadowComposites.length || shadowPieces.length) {
      var s5 = section("Shadow", shadowComposites.length + shadowPieces.length);
      if (shadowComposites.length) {
        shadowComposites.forEach(function (d) {
          var card = el("div", "shadow-card");
          card.style.boxShadow = "var(" + d.name + ")";
          card.style.marginBottom = "1rem";
          card.textContent = d.name;
          s5.appendChild(card);
        });
      }
      if (shadowPieces.length) {
        s5.appendChild(el("div", "group-label", "component pieces"));
        var sg = el("div", "grid");
        shadowPieces.forEach(function (d) {
          var isCol = isColorValue(resolve(d.value, valueMap));
          if (isCol) { sg.appendChild(swatch(d, resolve(d.value, valueMap))); return; }
          var c = el("div", "swatch");
          var meta = el("div", "meta");
          meta.appendChild(el("code", "name", d.name));
          meta.appendChild(el("code", "val", resolve(d.value, valueMap)));
          c.appendChild(meta);
          sg.appendChild(c);
        });
        s5.appendChild(sg);
      }
      out.appendChild(s5);
    }

    /* --- components --- */
    if (components.length) {
      var total = 0;
      components.forEach(function (c) { total += c.tokens.length; });
      var s6 = section("Components", total);

      components.forEach(function (c) {
        s6.appendChild(el("div", "group-label", c.name));

        var byProp = {};
        c.tokens.forEach(function (t) { byProp[t.prop] = t.name; });

        /* Distinguish base properties from their stateful variants. */
        var states = {};
        Object.keys(byProp).forEach(function (prop) {
          var m = /^(.*)-(active|hover|focus|pressed|selected|open|disabled)$/.exec(prop);
          if (m) { states[m[2]] = 1; }
        });
        var stateNames = Object.keys(states);

        var wrap = el("div", "cmp");
        var hint = el("p", "hint");
        hint.textContent = stateNames.length
          ? "Open an item to apply the “" + stateNames.join("/") + "” tokens."
          : "Rendered from this component’s own tokens.";
        wrap.appendChild(hint);

        /* Build one closed and one state-bearing instance. */
        [false, true].forEach(function (openState) {
          if (openState && !stateNames.length) return;
          var st = stateNames[0];
          var det = document.createElement("details");
          if (openState) det.open = true;

          function pick(base) {
            if (openState && st && byProp[base + "-" + st]) return byProp[base + "-" + st];
            return byProp[base] || null;
          }
          var bgTok = pick("background");
          var fgTok = pick("foreground");
          var bdTok = pick("border");

          if (bdTok) det.style.borderColor = "var(" + bdTok + ")";
          else det.style.borderColor = "var(--border-base, #ccc)";

          var sum = document.createElement("summary");
          sum.textContent = c.name + (openState ? " · " + st : " · default");
          if (bgTok) sum.style.background = "var(" + bgTok + ")";
          if (fgTok) sum.style.color = "var(" + fgTok + ")";

          var body = el("div", "body");
          if (byProp["background-section"]) {
            body.style.background = "var(" + byProp["background-section"] + ")";
          } else if (byProp["background"]) {
            body.style.background = "var(" + byProp["background"] + ")";
          }
          if (byProp["foreground"]) body.style.color = "var(" + byProp["foreground"] + ")";
          if (bdTok) body.style.borderTopColor = "var(" + bdTok + ")";
          body.textContent = "Body content rendered with " +
            (byProp["background-section"] ? "background-section" : "background") + ".";

          det.appendChild(sum);
          det.appendChild(body);
          wrap.appendChild(det);
        });
        s6.appendChild(wrap);

        /* Full token list for this component, so nothing is hidden by state. */
        var grid = el("div", "grid");
        c.tokens.forEach(function (t) {
          var r = resolve(t.value, valueMap);
          if (isColorValue(r)) grid.appendChild(swatch({ name: t.name, value: t.value }, r));
          else {
            var box = el("div", "swatch");
            var meta = el("div", "meta");
            meta.appendChild(el("code", "name", t.name));
            meta.appendChild(el("code", "val", r));
            box.appendChild(meta);
            grid.appendChild(box);
          }
        });
        s6.appendChild(grid);
      });
      out.appendChild(s6);
    }

    /* --- anything left unclassified, so no token goes unshown --- */
    var shown = {};
    [primColors, semColors, dimens, shadowPieces, shadowComposites].forEach(function (arr) {
      arr.forEach(function (d) { shown[d.name] = 1; });
    });
    Object.keys(typoNames).forEach(function (n) { shown[n] = 1; });
    Object.keys(componentNames).forEach(function (n) { shown[n] = 1; });

    var unclassified = all.filter(function (d) { return !shown[d.name]; });
    if (unclassified.length) {
      var s7 = section("Other tokens", unclassified.length);
      var g = el("div", "grid");
      unclassified.forEach(function (d) {
        var box = el("div", "swatch");
        var meta = el("div", "meta");
        meta.appendChild(el("code", "name", d.name));
        meta.appendChild(el("code", "val", resolve(d.value, valueMap)));
        box.appendChild(meta);
        g.appendChild(box);
      });
      s7.appendChild(g);
      out.appendChild(s7);
    }

    /* Values and badges are appended above; fill them in once the DOM is
       complete, reading whichever theme ended up active. */
    refreshValues();
    refreshContrast();
  }

  /* ---------- boot ----------
     No network request and no stylesheet-source read, so this runs the same
     way from file:// as it does over http. */
  function start() {
    try {
      if (!TOKEN_STRUCTURE.length) throw new Error("empty");

      if (!stylesheetIsLive(TOKEN_STRUCTURE)) {
        var box = document.getElementById("load-error");
        box.hidden = false;
        box.innerHTML =
          "<strong>No token values are reaching this page.</strong><br>" +
          "The structure below was read from <code>" + TOKENS_HREF + "</code>, but none of " +
          "those custom properties currently resolve, so <code>" + TOKENS_HREF + "</code> is " +
          "most likely missing, renamed, or failing to load. Check that it sits next to this " +
          "file and that the <code>&lt;link rel=\"stylesheet\"&gt;</code> in this page's " +
          "<code>&lt;head&gt;</code> points at it.";
      }

      build(collect());
    } catch (err) {
      var box2 = document.getElementById("load-error");
      box2.hidden = false;
      box2.textContent = "Could not build the token report: " + (err && err.message);
      document.getElementById("summary").textContent = "Failed to read tokens.";
    }
  }

  /* Wait for the stylesheet to apply before taking any measurement. */
  if (document.readyState === "complete") start();
  else window.addEventListener("load", start);
})();
</script>
</body>
</html>
